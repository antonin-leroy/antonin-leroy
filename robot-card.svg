      <text xml:space="preserve" x="201.1" y="236">*=*%%%%@%%</text>
      <text xml:space="preserve" x="208.8" y="251">++%*#%##</text>
      <text xml:space="preserve" x="208.8" y="266">#+##*###</text>
      <text xml:space="preserve" x="208.8" y="281">@*#%@%@</text>

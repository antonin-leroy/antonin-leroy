    <text xml:space="preserve" x="24" y="191">   -+**#*-=====-===*#*#**+</text>
    <text xml:space="preserve" x="24" y="206">   -*#%#*-=++++++++*#%%*=+-</text>
    <text xml:space="preserve" x="24" y="221">   :=+* --=+++++++**+ *=---</text>
    <text xml:space="preserve" x="24" y="236">  ::-=+ -:-++++++**=+</text>
    <text xml:space="preserve" x="24" y="251">  :%@@* %=:+******++%</text>
    <text xml:space="preserve" x="24" y="266">  =%@%   %-+******+%</text>
    <text xml:space="preserve" x="24" y="281"> =*%%#    @#*****#@</text>

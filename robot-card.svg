    <text xml:space="preserve" x="24" y="461">         =###*        *+**#%%</text>
    <g class="arm">
      <text xml:space="preserve" x="301.2" y="131">++</text>
      <text xml:space="preserve" x="293.5" y="146">=*+*</text>
      <text xml:space="preserve" x="262.7" y="161">-+ %#+=+==</text>
      <text xml:space="preserve" x="270.4" y="176">*##%%#=</text>
      <text xml:space="preserve" x="270.4" y="191">=%#%%</text>
      <text xml:space="preserve" x="262.7" y="206">-=+*</text>

    <text xml:space="preserve" x="24" y="311"> :+**#  +**%@@@@@%#%#</text>
    <text xml:space="preserve" x="24" y="326"> -#%##  %%%***##*#%%</text>
    <text xml:space="preserve" x="24" y="341"> +#+%   %*+########*@=</text>
    <text xml:space="preserve" x="24" y="356"> ++**  -+%@@%@##%#%%##-</text>
    <text xml:space="preserve" x="24" y="371"> =-*   --#@%*   %#+**+--</text>
    <text xml:space="preserve" x="24" y="386"> ++=   ---=#%#    %#*----</text>
    <text xml:space="preserve" x="24" y="401">**#*=- -=--=*@    %%%=----</text>
    <text xml:space="preserve" x="24" y="416">%%*% = -====*%     #%#----</text>
    <text xml:space="preserve" x="24" y="431">-=+     ====+*      #*--+*=</text>

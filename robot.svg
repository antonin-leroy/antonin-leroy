<svg xmlns="http://www.w3.org/2000/svg" width="379" height="481" viewBox="0 0 379 481" font-family="'Courier New', Consolas, 'DejaVu Sans Mono', monospace">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .art { fill: #39d353; font-size: 13px; animation: bob 4s ease-in-out infinite; }
    .hand { fill: #e3b341; font-size: 26px; font-weight: bold; transform-origin: 133.8px 46px; animation: wave 3s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-3px); }
    }
    @keyframes wave {
      0%   { transform: rotate(0deg); }
      8%   { transform: rotate(22deg); }
      16%  { transform: rotate(-8deg); }
      24%  { transform: rotate(22deg); }
      32%  { transform: rotate(-8deg); }
      40%  { transform: rotate(14deg); }
      50%  { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="378" height="480" rx="14" />
  <text class="hand" x="131.8" y="42">o/</text>
